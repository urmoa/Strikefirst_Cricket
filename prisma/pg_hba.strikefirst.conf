# Place before existing rules in pg_hba.conf; first matching rule wins.
# Application connections are allowed only to strikefirst over local sockets/loopback.
local strikefirst strikefirst_app scram-sha-256
local all strikefirst_app reject
local replication strikefirst_app reject
host strikefirst strikefirst_app 127.0.0.1/32 scram-sha-256
host strikefirst strikefirst_app ::1/128 scram-sha-256
host all strikefirst_app all reject
host replication strikefirst_app all reject
